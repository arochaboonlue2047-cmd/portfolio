<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" shape-rendering="crispEdges">
  <!-- Black background lines & blocks on yellow -->
  <rect x="4" y="4" width="40" height="40" fill="none" stroke="#000000" stroke-width="3"/>
  <!-- Top Headline block -->
  <rect x="9" y="9" width="30" height="4" fill="#000000"/>
  <!-- Image block on left -->
  <rect x="9" y="17" width="13" height="13" fill="#000000"/>
  <!-- Inner image highlight -->
  <rect x="13" y="21" width="5" height="5" fill="#ffff00"/>
  <!-- Text lines on right -->
  <rect x="25" y="17" width="14" height="2" fill="#000000"/>
  <rect x="25" y="21" width="14" height="2" fill="#000000"/>
  <rect x="25" y="25" width="14" height="2" fill="#000000"/>
  <rect x="25" y="29" width="14" height="2" fill="#000000"/>
  <!-- Bottom text lines -->
  <rect x="9" y="34" width="30" height="2" fill="#000000"/>
  <rect x="9" y="38" width="22" height="2" fill="#000000"/>
</svg>
