  <rect x="13" y="7" width="28" height="3" fill="#00ffff"/>
  <rect x="9" y="10" width="36" height="3" fill="#00ffff"/>
  <rect x="6" y="13" width="42" height="3" fill="#00ffff"/>
  <rect x="4" y="16" width="46" height="4" fill="#00ffff"/>
  <rect x="3" y="20" width="48" height="14" fill="#00ffff"/>
  <rect x="4" y="34" width="46" height="4" fill="#00ffff"/>
  <rect x="6" y="38" width="42" height="3" fill="#00ffff"/>
  <rect x="9" y="41" width="36" height="3" fill="#00ffff"/>
  <rect x="13" y="44" width="28" height="3" fill="#00ffff"/>
  <rect x="20" y="47" width="14" height="3" fill="#00ffff"/>

  <!-- Inner Black Hole -->
  <rect x="18" y="8" width="18" height="3" fill="#000000"/>
  <rect x="12" y="11" width="30" height="3" fill="#000000"/>
  <rect x="9" y="14" width="36" height="3" fill="#000000"/>
  <rect x="8" y="17" width="38" height="4" fill="#000000"/>
