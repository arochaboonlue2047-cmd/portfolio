  <rect x="12" y="40" width="30" height="3" fill="#000000"/>
  <rect x="18" y="43" width="18" height="3" fill="#000000"/>

  <!-- Clock Hands (Center: 27, 27) -->
  <!-- Center Pivot -->
  <rect x="25" y="25" width="4" height="4" fill="#00ffff"/>
  <!-- Minute Hand pointing up to 12 -->
  <rect x="26" y="14" width="3" height="12" fill="#00ffff"/>
  <!-- Hour Hand pointing right to 3 -->
  <rect x="26" y="26" width="11" height="3" fill="#00ffff"/>
</svg>
